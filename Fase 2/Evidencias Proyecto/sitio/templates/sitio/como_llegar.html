{% extends "sitio/base.html" %}
{% block title %}Como llegar · {{ SITIO.nombre }}{% endblock %}
{% block hero %}<h1 class="page-title">Como llegar</h1>{% endblock %}
{% block content %}
<section class="section-olive">
  <div class="container text-center">
    <div class="ratio ratio-4x3 mapa mx-auto">
      <iframe src="https://www.google.com/maps?q=Parque+real+8+b,+Pirque,+Chile&output=embed"
              loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"
              title="Mapa de {{ SITIO.nombre }}"></iframe>
    </div>
    <p class="mt-3 mb-0">{{ SITIO.direccion }}</p>
  </div>
</section>
{% endblock %}
